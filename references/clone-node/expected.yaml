apiVersion: "apps/v1"
kind: "Deployment"
metadata:
  name: "api"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: "api"
  template:
    metadata:
      labels:
        app: "api"
    spec:
      containers:
        - name: "api"
          image: "example.test.walnuts.dev/api:v1"
---
apiVersion: "apps/v1"
kind: "Deployment"
metadata:
  name: "worker"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: "worker"
  template:
    metadata:
      labels:
        app: "worker"
    spec:
      containers:
        - name: "api"
          image: "example.test.walnuts.dev/api:v1"
---
apiVersion: "v1"
kind: "Service"
metadata:
  name: "api"
spec:
  selector:
    app: "api"
  ports:
    - port: 8080
---
apiVersion: "v1"
kind: "Service"
metadata:
  name: "worker"
spec:
  selector:
    app: "worker"
  ports:
    - port: 8080
