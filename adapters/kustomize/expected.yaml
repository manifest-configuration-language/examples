apiVersion: "apps/v1"
kind: "Deployment"
metadata:
  name: "sample-api"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: "sample-api"
  template:
    metadata:
      labels:
        app: "sample-api"
    spec:
      containers:
        - image: "example.test.walnuts.dev/api:v1"
          name: "api"
