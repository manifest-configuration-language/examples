name: Release Playground examples package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: npm-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.22.0

      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./packages/examples/package.json').version")"
          if [[ "$RELEASE_TAG" != "v$version" ]]; then
            printf 'Tag %s does not match package version %s\n' "$RELEASE_TAG" "$version" >&2
            exit 1
          fi

      - name: Publish package with provenance
        working-directory: packages/examples
        run: npm publish --provenance --access public
