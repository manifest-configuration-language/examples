name: Release examples archive

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag, for example v1.2.3. Empty selects the next patch version.
        required: false
        type: string
      mcl_version:
        description: Published MCL CLI version used to validate every example, for example v1.2.3.
        required: false
        default: v0.1.0
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: examples-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate MCL release version
        env:
          MCL_VERSION: ${{ inputs.mcl_version || vars.MCL_VERSION || 'v0.1.0' }}
        run: |
          set -euo pipefail
          [[ "$MCL_VERSION" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]
          version="${MCL_VERSION#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
        id: mcl

      - name: Download and verify released MCL CLI
        env:
          MCL_VERSION: ${{ steps.mcl.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          archive="mcl_${MCL_VERSION}_linux_amd64.tar.gz"
          install_dir="$RUNNER_TEMP/mcl-cli"
          mkdir -p "$install_dir"
          gh release download "v${MCL_VERSION}" \
            --repo manifest-configuration-language/mcl \
            --pattern "$archive" \
            --pattern SHA256SUMS \
            --dir "$install_dir"
          (cd "$install_dir" && grep " $archive$" SHA256SUMS | sha256sum --check)
          tar -xzf "$install_dir/$archive" -C "$install_dir"
          mv "$install_dir/mcl-linux-amd64" "$install_dir/mcl"
          echo "$install_dir" >> "$GITHUB_PATH"

      - name: Verify examples and rendered outputs
        run: scripts/verify-examples.sh

      - name: Resolve release target
        id: target
        env:
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            if [ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
              echo "Run this workflow from the default branch." >&2
              exit 1
            fi
            release_tag="$RELEASE_TAG_INPUT"
            if [ -z "$release_tag" ]; then
              latest_tag="$(git tag --list 'v[0-9]*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)"
              if [ -z "$latest_tag" ]; then
                release_tag=v0.1.0
              else
                version="${latest_tag#v}"
                IFS=. read -r major minor patch <<< "$version"
                release_tag="v${major}.${minor}.$((patch + 1))"
              fi
            fi
          else
            release_tag="$GITHUB_REF_NAME"
          fi
          [[ "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          if git rev-parse -q --verify "refs/tags/$release_tag" >/dev/null && [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            echo "Release tag $release_tag already exists." >&2
            exit 1
          fi
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "version=${release_tag#v}" >> "$GITHUB_OUTPUT"

      - name: Build archive and checksums
        env:
          RELEASE_VERSION: ${{ steps.target.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          git archive --format=tar.gz --prefix="mcl-examples-${RELEASE_VERSION}/" "$GITHUB_SHA" > "dist/mcl-examples-${RELEASE_VERSION}.tar.gz"
          (cd dist && shasum -a 256 "mcl-examples-${RELEASE_VERSION}.tar.gz" > SHA256SUMS)

      # GitHub FreeではPrivateリポジトリのArtifact Attestationを利用できないため、公開時のみ生成します。
      - name: Attest archive
        if: github.repository_visibility == 'public'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/*.tar.gz

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.target.outputs.tag }}
          RELEASE_VERSION: ${{ steps.target.outputs.version }}
        run: |
          set -euo pipefail
          release_flags=()
          if [[ "$RELEASE_VERSION" == *-* ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "MCL examples $RELEASE_VERSION" \
            --generate-notes \
            "${release_flags[@]}"
