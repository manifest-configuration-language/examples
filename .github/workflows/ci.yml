name: Examples

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: examples-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download and verify released MCL CLI
        env:
          MCL_VERSION: ${{ vars.MCL_VERSION || 'v0.1.0' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$MCL_VERSION" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]
          version="${MCL_VERSION#v}"
          archive="mcl_${version}_linux_amd64.tar.gz"
          install_dir="$RUNNER_TEMP/mcl-cli"
          mkdir -p "$install_dir"
          gh release download "v${version}" \
            --repo manifest-configuration-language/mcl \
            --pattern "$archive" \
            --pattern SHA256SUMS \
            --dir "$install_dir"
          (cd "$install_dir" && grep " $archive$" SHA256SUMS | sha256sum --check)
          tar -xzf "$install_dir/$archive" -C "$install_dir"
          mv "$install_dir/mcl-linux-amd64" "$install_dir/mcl"
          echo "$install_dir" >> "$GITHUB_PATH"

      - name: Check all examples
        run: |
          set -euo pipefail
          while IFS= read -r -d '' sample; do
            echo "Checking $sample"
            mcl check "$sample"
          done < <(find . -name main.mcl -print0 | sort -z)
