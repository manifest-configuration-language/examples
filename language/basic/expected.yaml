apiVersion: "apps/v1"
kind: "Deployment"
metadata:
  name: "sample-api"
  labels:
    app: "sample-api"
    app.kubernetes.io/name: "sample-api"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: "sample-api"
  template:
    metadata:
      labels:
        app: "sample-api"
    spec:
      containers:
        - name: "sample-api"
          image: "example.test.walnuts.dev/sample-api:v1.2.0"
