apiVersion: "v1"
kind: "ConfigMap"
metadata:
  name: "sample-api-config"
  namespace: "default"
data:
  LOG_LEVEL: "info"
---
apiVersion: "apps/v1"
kind: "Deployment"
metadata:
  name: "sample-api"
  namespace: "default"
  labels:
    app: "sample-api"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: "sample-api"
  template:
    metadata:
      labels:
        app: "sample-api"
    spec:
      containers:
        - securityContext:
            allowPrivilegeEscalation: false
            seccompProfile:
              type: "RuntimeDefault"
            capabilities:
              drop:
                - "ALL"
          name: "api"
          image: "example.test.walnuts.dev/api:v1"
---
apiVersion: "v1"
kind: "Service"
metadata:
  name: "sample-api"
  namespace: "default"
spec:
  selector:
    app: "sample-api"
  ports:
    - name: "http"
      port: 80
      targetPort: 8080
